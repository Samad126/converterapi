# nginx sites for the converter stack: the frontend AND the API.
#
# ONE file, TWO origins. They are separate hostnames that happen to share a
# server and a deployment, so they share a config - but they remain separate
# origins as far as a browser is concerned, which is why the API answers CORS
# and the frontend does not have to.
#
# Install:
#
#   sudo cp deploy/converter.alakbaroff.com.conf \
#     /etc/nginx/conf.d/converter.alakbaroff.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sites on this host live in /etc/nginx/conf.d, so there is no
# sites-available / sites-enabled symlink pair to maintain.
#
# Keep the .conf extension. nginx.conf pulls that directory in as
# `include /etc/nginx/conf.d/*.conf`, so a file named without it is not an
# error anywhere - it is silently skipped, nginx tests clean, reloads clean,
# and the site simply does not exist.
#
# TLS: this reuses the EXISTING wildcard certificate, `*.alakbaroff.com` from
# /etc/letsencrypt/live/alakbaroff.com/. A single-label wildcard covers both
# hostnames below, and certbot.timer already renews it twice daily, so there is
# no new certificate to issue and nothing new to renew.
#
# To give these hosts their own certificate instead (isolation: revoking or
# misconfiguring the wildcard would no longer take both subdomains down with
# it):
#
#   sudo certbot --nginx -d converter.alakbaroff.com -d converterapi.alakbaroff.com
#
# then change the ssl_certificate paths in both HTTPS blocks. The HTTP block's
# webroot is already set up for that, so the challenge works as-is.

# ---------------------------------------------------------------------------
# HTTP - redirect both hostnames to HTTPS
#
# One block for both, because the only thing it does is the same for each.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name converter.alakbaroff.com converterapi.alakbaroff.com;

    # Certbot's webroot. Redirecting the challenge URL instead would be the
    # classic own goal: HTTP-01 validation is issued over plain HTTP and does
    # not follow the redirect to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS - the frontend (Next.js)
#
# A pure reverse proxy: this block does not know or care what the page is.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name converter.alakbaroff.com;

    ssl_certificate     /etc/letsencrypt/live/alakbaroff.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alakbaroff.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    location / {
        # The frontend container publishes on loopback (127.0.0.1:3011), the
        # same way the API publishes on 3010 - see docker-compose.yml. If the
        # frontend ever joins the compose network instead, change this to its
        # service name and put nginx on that network.
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;

        # WebSocket upgrade, for Next's dev-server HMR channel. Harmless in
        # production and required if anyone ever serves a dev build here.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliberately NOT the 3600s used on the sibling Next site. That value
        # is for a long-lived HMR socket; here it would only mean a wedged
        # upstream ties up a worker for an hour before anything notices. Two
        # minutes is generous for a server-rendered page.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Nothing uploads through this block - the browser sends the file straight
    # to the API host - so the proxy's default 1m body limit is left alone.
    # Raising it here would widen an opening that nothing needs.

    access_log /var/log/nginx/converter.alakbaroff.com.access.log;
    error_log  /var/log/nginx/converter.alakbaroff.com.error.log;
}

# ---------------------------------------------------------------------------
# HTTPS - the API
#
# This is the block with all the conversion-specific handling: the body limit,
# the timeouts that outlast a conversion, and the 413 the client reads.
# ---------------------------------------------------------------------------
server {
    # No `http2` here, matching the other sites on this host. The standalone
    # `http2 on;` directive needs nginx 1.25.1+ and is a hard `nginx -t`
    # failure on this box's 1.24.0. The older `listen ... http2` parameter form
    # does work on 1.24, but nothing else here uses it and a 100 MB upload gains
    # little from it - one less difference from the configs that already work.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name converterapi.alakbaroff.com;

    ssl_certificate     /etc/letsencrypt/live/alakbaroff.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alakbaroff.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---------------------------------------------------------------------
    # CORS lives in the APPLICATION, not here - see src/middleware/cors.ts.
    #
    # It has to be one place for both supported deployment shapes, and it
    # belongs with the contract that `test/` can assert. The frontend is on a
    # different origin, so this is NOT optional: both the JSON reads and the
    # upload - which always preflights, because an XHR with an `upload`
    # listener sets the use-CORS-preflight flag - depend on the API answering.
    #
    # The single exception is the 413 below, which is the only CORS header this
    # file sets and for a narrow reason: nginx refuses an oversized upload
    # before it reaches Node, so no code of ours ever handles that response.
    #
    # Do NOT add a blanket `add_header Access-Control-Allow-Origin` at this
    # level to "be safe". nginx appends rather than replaces, so a response
    # from the application would go out carrying the header TWICE - and a
    # browser rejects a duplicated Access-Control-Allow-Origin outright, which
    # turns a working API into one that fails every request.
    # ---------------------------------------------------------------------

    # ---------------------------------------------------------------------
    # MUST match MAX_UPLOAD_BYTES in src/config.ts - 100 MB, 104857600 bytes.
    #
    # Matching it exactly is the point: an upload over the limit is refused
    # here, before a single byte of it reaches Node, so a large body cannot
    # tie up a worker or fill the container's tmpfs. If you change the
    # application limit, change this in the same commit; they are two halves
    # of one number.
    #
    # 100MB is also the hard ceiling Cloudflare's own edge enforces on a
    # proxied (orange-cloud) request body - going higher here would just be
    # dead configuration, since Cloudflare would refuse the request before it
    # ever reached this box.
    #
    # Note this is NOT duplicated on the frontend block above, and should not
    # be: the browser posts the file to THIS hostname directly.
    # ---------------------------------------------------------------------
    client_max_body_size 100m;

    location / {
        # 3010, not 3001: this host already runs nextudy on 3001, and the
        # frontend above owns 3011.
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # -----------------------------------------------------------------
        # IF Cloudflare proxies this hostname (orange cloud), the line above is
        # wrong and the rate limiter stops working.
        #
        # Cloudflare overwrites $remote_addr with its own edge IP, so
        # X-Forwarded-For carries the Cloudflare edge rather than the browser.
        # The app runs with TRUST_PROXY=1 - it trusts exactly one hop - so every
        # request would land in a bucket keyed by edge IP, and one busy
        # Cloudflare edge would exhaust the 30/min limit for everybody behind
        # it. Uncomment this ONE line to fix it:
        #
        # proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        #
        # Ignore all of this if the DNS record is set to "DNS only" (grey
        # cloud) - then the line above is already correct.
        # -----------------------------------------------------------------

        # The application's own deadline is 90s and the client gives up at
        # 120s. Neither is any use if nginx cuts the connection first, so give
        # the app room to answer with its own error rather than a bare 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Hand the upload straight through instead of spooling it to disk
        # first. Optional, but it halves the disk traffic for a 100 MB body.
        #
        # `proxy_request_buffering`, not `request_buffering` - the latter is not
        # a directive at all, and nginx refuses to load the whole file over it:
        # `unknown directive "request_buffering"` at `nginx -t`.
        proxy_request_buffering off;

        # The response is a PDF the client saves whole; there is nothing to
        # gain from buffering it.
        proxy_buffering off;
    }

    # ---------------------------------------------------------------------
    # nginx's own 413 is an HTML page, but the client reads `error.message`
    # out of the JSON envelope and shows it in a dialog. Without this, an
    # oversized upload shows the user a bare "HTTP 413" instead of a sentence.
    #
    # Keep the text byte-identical to src/errors.ts.
    # ---------------------------------------------------------------------
    error_page 413 /__too_large.json;

    location = /__too_large.json {
        internal;
        default_type application/json;

        # The ONLY CORS header in this file, and the only place it can go.
        #
        # nginx produces this 413 itself, because client_max_body_size refuses
        # the upload before Node is handed a single byte - so the application's
        # own CORS middleware never runs for this response and cannot set the
        # header. Without it the browser blocks the response and the user gets
        # a bare network error instead of the "too large" sentence above,
        # which is precisely the confusion this whole location exists to
        # prevent.
        #
        # `always` is required: add_header otherwise applies only to 2xx and
        # 3xx, and this is a 4xx - the header would be silently omitted on the
        # one response it was written for.
        #
        # This location is internal and never proxied, so it cannot collide
        # with the application's own header. Keep the origin in step with
        # CORS_ORIGIN in the compose environment.
        # -----------------------------------------------------------------
        add_header Access-Control-Allow-Origin "https://converter.alakbaroff.com" always;

        return 413 '{"error":{"code":"E_TOO_LARGE","message":"This document is too large to convert."}}';
    }

    # Access log. Note the application logs no filenames and no document
    # contents, and neither should this - the request line is enough.
    access_log /var/log/nginx/converterapi.alakbaroff.com.access.log;
    error_log  /var/log/nginx/converterapi.alakbaroff.com.error.log;
}
