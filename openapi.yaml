openapi: 3.1.0

info:
  title: Universal file converter
  version: 2.0.0
  summary: Converts documents, spreadsheets, presentations and images using LibreOffice headless.
  description: |
    Uploads a file and receives it converted to another format.

    ## The contract

    This API is consumed by a **shipped Android client**, so the following
    properties are part of the contract and are not free to change.

    > **Breaking change: `POST /convert` without a target no longer exists.**
    > Clients must post to `/convert/pdf`. A client still using the bare path
    > gets the catch-all `404`, whose message tells the user to update the app.

    - **Success is `200` with the target's own media type.** For `pdf` that is
      exactly `application/pdf`, with no charset suffix: the client compares the
      header and refuses anything else, so a stray `text/html` on a `200` is a
      client-visible failure.
    - **Failure is a non-2xx with the JSON error envelope.** The client reads
      `error.message` and shows it verbatim in a dialog, falling back to
      `"HTTP <status>"` when the body is missing or is not JSON.
    - **A failure is never a `200`.** The client checks the status before it
      reads anything, so a `200` is treated as the converted file and fails
      downstream.
    - **`error.message` is user-facing prose.** It is a complete sentence with
      no stack traces, no paths and no codes, because a person reads it.
      `error.code` is for logs and metrics only; the client never displays it.

    ## Choosing the output format

    The target is part of the path and is REQUIRED: `/convert/pdf`,
    `/convert/xlsx`, `/convert/png`. There is deliberately no bare `/convert`
    that assumes a format - one address that means one thing is easier to
    document and to test than two that mean the same thing.

    **Not every source can become every target.** The matrix is finite and
    deliberate - `GET /formats` returns it in full, machine-readably. Asking for
    a target that exists but is not reachable from your file is a `415`; asking
    for a target that does not exist at all is a `404`. Both messages list the
    alternatives, so a client never has to hard-code the table to give a useful
    error.

    ## Filenames

    The response offers the uploaded file's name with the new extension:
    `Quarterly report.docx` converted to `pdf` downloads as
    `Quarterly report.pdf`. The name is sanitised before it is echoed - path
    segments and control characters are removed - and a name with nothing usable
    in it becomes `converted.<ext>`.

    ## Image targets are archives

    `png` and `jpg` produce **one image per page**, so they answer with
    `application/zip` holding `slide-1.png`, `slide-2.png`, ... This is true even
    for a one-page document: the content type must not depend on how many pages
    the upload happened to have, or every client has to sniff what it received.

    ## Timing

    The client aborts the whole request after **120 seconds**. The server's own
    deadline is **90 seconds** and covers the entire pipeline - including the
    render-then-rasterise second step an image target needs - so that it can
    still answer with a proper `504` instead of being killed mid-conversion.

    ## Uploads

    Requests are `multipart/form-data` with exactly one file part. The import
    filter is chosen from the **filename extension**, never from the declared
    MIME type: the client deliberately sends `application/octet-stream`, and a
    hostile client could declare anything at all.
  contact:
    name: Converter maintainers
  license:
    name: Proprietary

servers:
  - url: /
    description: This server

tags:
  - name: convert
    description: Document conversion.
  - name: pages
    description: Page-level PDF operations - merge, split, remove, extract, reorder, scan.
  - name: discovery
    description: What this service can do.
  - name: ops
    description: Operational endpoints.

paths:
  /convert/{target}:
    post:
      tags: [convert]
      operationId: convertToFormat
      summary: Convert a file to a named format
      description: |
        Converts the upload to `target`, which must be an id from
        `GET /formats` (`pdf`, `odt`, `docx`, `txt`, `html`, `rtf`, `epub`,
        `ods`, `xlsx`, `csv`, `odp`, `pptx`, `png`, `jpg`, `tables`, `layers`,
        `pdfa`).

        The document is parsed by LibreOffice, which is a large C++ codebase
        handling untrusted input. **Treat a conversion failure as an expected,
        normal event**, not as an incident.

        The endpoint is unauthenticated and cannot be otherwise: the client is
        an APK, so any secret shipped inside it is public. Requests are
        rate-limited per IP and conversions run under a bounded concurrency
        limit; both are sources of `429` and `503` that a well-formed request
        can hit.
      x-max-upload-bytes: 26214400
      parameters:
        - name: target
          in: path
          required: true
          description: |
            The format to produce. Case-sensitive, without a leading dot.
          schema:
            $ref: '#/components/schemas/TargetId'
      requestBody:
        $ref: '#/components/requestBodies/Upload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToTarget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/UnknownTarget'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedTarget'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'
        '504':
          $ref: '#/components/responses/Timeout'

  /pdf/merge:
    post:
      tags: [pages]
      operationId: mergePdfs
      summary: Merge two or more PDFs into one
      description: |
        Concatenates every page of every uploaded PDF into one PDF, in the
        order the files were uploaded. Each file contributes all of its own
        pages, in its own order - there is no separate page-selection step
        here, only file order.
      requestBody:
        $ref: '#/components/requestBodies/MergeUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/TooFewFiles'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/split:
    post:
      tags: [pages]
      operationId: splitPdf
      summary: Split a PDF into several PDFs
      description: |
        Cuts one PDF into consecutive chunks of `every` pages each, answered
        as a ZIP of `part-1.pdf`, `part-2.pdf`, ... - always an archive, even
        when the result is a single part, so the response shape never depends
        on how the split happened to come out.
      requestBody:
        $ref: '#/components/requestBodies/SplitUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToTarget'
        '400':
          $ref: '#/components/responses/BadPageRange'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/remove-pages:
    post:
      tags: [pages]
      operationId: removePdfPages
      summary: Remove pages from a PDF
      description: |
        Answers with the PDF minus the named pages, everything else kept in
        its original order. Removing every page is refused with `400` rather
        than answering with an empty PDF nobody could open.
      requestBody:
        $ref: '#/components/requestBodies/RemovePagesUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/BadPageRange'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/extract-pages:
    post:
      tags: [pages]
      operationId: extractPdfPages
      summary: Extract a subset of a PDF's pages
      description: |
        Answers with a PDF holding only the named pages, in the exact order
        they were named - `pages=3,1` extracts pages 1 and 3 and puts page 3
        first, so this can reorder as well as select.
      requestBody:
        $ref: '#/components/requestBodies/ExtractPagesUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/BadPageRange'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/organize:
    post:
      tags: [pages]
      operationId: organizePdf
      summary: Reorder a PDF's pages
      description: |
        Answers with the PDF's pages rearranged into `order`, which must name
        every page exactly once - unlike `/pdf/extract-pages`, this refuses a
        selection that would drop or duplicate a page, because reordering and
        removing are different operations here.
      requestBody:
        $ref: '#/components/requestBodies/OrganizeUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/BadPageRange'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/scan-to-pdf:
    post:
      tags: [pages]
      operationId: scanToPdf
      summary: Build a PDF from a set of images
      description: |
        Answers with one PDF holding one page per uploaded image, in upload
        order. Each page is sized to its own image's pixel dimensions, so a
        portrait photo and a landscape photo in the same request each get a
        correctly-shaped page rather than being forced into one fixed size.
      requestBody:
        $ref: '#/components/requestBodies/ScanUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/TooFewFiles'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /formats:
    get:
      tags: [discovery]
      operationId: listFormats
      summary: The conversion matrix
      description: |
        Every source extension this service accepts, and every target each one
        can become.

        Exists so a client does not have to hard-code the table: the shipped
        client is an APK, and without this, teaching it a new output format
        would mean shipping a new APK. A client that hard-codes the matrix will
        silently disagree with the server the first time the server grows.
      responses:
        '200':
          description: The matrix.
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [sources, targets]
                properties:
                  sources:
                    type: array
                    description: Accepted upload types, keyed by extension.
                    items:
                      type: object
                      required: [extension, mediaType, family, targets]
                      properties:
                        extension:
                          type: string
                          example: .docx
                        mediaType:
                          type: string
                        family:
                          type: [string, 'null']
                          description: |
                            The LibreOffice document family that handles it.
                            Sources in the same family convert the same way.

                            `null` for a source LibreOffice does not open at
                            all - `.psd` today. Such a source is handled
                            entirely by this service's own code, which is why
                            it can only ever offer `extract` targets; its
                            absence is a fact about the source rather than a
                            field this version happens to omit.
                          enum: [writer, calc, impress, draw, null]
                        targets:
                          type: array
                          items:
                            $ref: '#/components/schemas/TargetId'
                  targets:
                    type: array
                    description: Every format this service can produce.
                    items:
                      type: object
                      required: [id, extension, mediaType, label, multiple]
                      properties:
                        id:
                          $ref: '#/components/schemas/TargetId'
                        extension:
                          type: string
                          example: .pdf
                        mediaType:
                          type: string
                        label:
                          type: string
                          description: Short name, as used in error messages.
                          example: PDF
                        multiple:
                          type: boolean
                          description: |
                            When true the response is a ZIP of one file per page
                            rather than a single file. Always an archive for
                            these, even for a one-page source.
              example:
                sources:
                  - extension: .docx
                    mediaType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
                    family: writer
                    targets: [pdf, odt, txt, html, rtf, epub]
                targets:
                  - id: pdf
                    extension: .pdf
                    mediaType: application/pdf
                    label: PDF
                    multiple: false
                  - id: png
                    extension: .png
                    mediaType: image/png
                    label: PNG
                    multiple: true

  /health:
    get:
      tags: [ops]
      operationId: health
      summary: Liveness check
      description: |
        Returns `ok` once the service is ready to convert.

        The service only begins listening after LibreOffice has been confirmed
        on `PATH`, the rasteriser has been confirmed, the metric-compatible
        fonts have been verified, and a warm-up conversion has succeeded **for
        every document family** - so reaching this endpoint at all means the
        whole matrix is ready, not merely that the process is up.

        It does not exercise a conversion of its own.
      responses:
        '200':
          description: The service is ready.
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok

components:
  requestBodies:
    Upload:
      required: true
      description: |
        Exactly one file part named `file`. Additional parts, or a part under
        a different name, are rejected with `400`.

        The overall body limit is **26214400 bytes (25 MB)**, matching the
        client's own `MAX_UPLOAD_BYTES` and the reverse proxy's body limit.
        Exceeding it at any layer produces `413`.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            additionalProperties: false
            properties:
              file:
                type: string
                format: binary
                description: |
                  The file to convert. Its **filename extension** selects the
                  import filter and must be one of the extensions listed by
                  `GET /formats` (case-insensitive). The declared `Content-Type`
                  of this part is ignored.

                  The filename is never used as a path on disk: the upload is
                  written to a server-generated name inside a per-request
                  temporary directory, so a name like `../../etc/passwd.docx`
                  is harmless.
          encoding:
            file:
              contentType: application/octet-stream

    MergeUpload:
      required: true
      description: |
        Two or more PDFs, all under the field name `files`, in the order they
        should be concatenated.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [files]
            properties:
              files:
                type: array
                minItems: 2
                items:
                  type: string
                  format: binary
                description: The PDFs to merge, in order. Each must be a `.pdf`.

    SplitUpload:
      required: true
      description: One PDF, plus how many pages each output file should hold.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: The PDF to split.
              every:
                type: string
                description: |
                  Pages per output file, as a positive whole number. Defaults
                  to `1` (one file per page). The last file holds whatever is
                  left over: a 7-page document split every 3 pages produces
                  3, 3, then 1 page.
                example: '1'

    RemovePagesUpload:
      required: true
      description: One PDF, plus which pages to remove.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, pages]
            properties:
              file:
                type: string
                format: binary
                description: The PDF to remove pages from.
              pages:
                type: string
                description: |
                  1-based page numbers and inclusive ranges to remove, comma
                  separated: `2,5-7,10`. Removing every page is refused.
                example: '2,5-7'

    ExtractPagesUpload:
      required: true
      description: One PDF, plus which pages to keep, in the order to keep them.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, pages]
            properties:
              file:
                type: string
                format: binary
                description: The PDF to extract pages from.
              pages:
                type: string
                description: |
                  1-based page numbers and inclusive ranges to keep, comma
                  separated, in the exact order they should appear in the
                  output: `3,1,2` keeps pages 1-3, reordered.
                example: '1,3-4'

    OrganizeUpload:
      required: true
      description: One PDF, plus its new page order.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, order]
            properties:
              file:
                type: string
                format: binary
                description: The PDF to reorder.
              order:
                type: string
                description: |
                  The new page order, as 1-based page numbers and inclusive
                  ranges naming EVERY page of the document exactly once:
                  `3,1,2` on a 3-page document reorders it, but `1,2` or
                  `1,1,2` are refused, because organizing does not drop or
                  duplicate a page - use `/pdf/remove-pages` to drop one.
                example: '3,1,2'

    ScanUpload:
      required: true
      description: |
        One or more images, all under the field name `files`, in the order
        they should become pages.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [files]
            properties:
              files:
                type: array
                minItems: 1
                items:
                  type: string
                  format: binary
                description: |
                  The images to scan, in order. Each must be `.png`, `.jpg`
                  or `.jpeg`. Each page is sized to its own image's pixel
                  dimensions, so mixing portrait and landscape photos is fine.

  schemas:
    TargetId:
      type: string
      description: |
        Identifier of an output format, as used in the `/convert/{target}` path
        and returned by `GET /formats`.
      enum: [pdf, odt, docx, txt, html, rtf, epub, ods, xlsx, csv, odp, pptx, png, jpg, tables, layers, pdfa]

    ErrorCode:
      type: string
      description: |
        Stable machine-readable identifier for the failure. For logs, metrics
        and support only - the client never shows this to the user.
      enum:
        - E_CONVERT_FAILED
        - E_TIMEOUT
        - E_ENCRYPTED
        - E_UNSUPPORTED
        - E_UNSUPPORTED_TARGET
        - E_UNKNOWN_TARGET
        - E_TOO_LARGE
        - E_NO_TABLES
        - E_NO_LAYERS
        - E_BAD_PAGE_RANGE
        - E_TOO_FEW_FILES
        - E_BUSY
        - E_BAD_REQUEST
        - E_RATE_LIMITED
        - E_INTERNAL

    ErrorEnvelope:
      type: object
      description: |
        The body of every non-2xx response. There are no exceptions: error
        paths that Express or multer would normally render as an HTML page are
        overridden to produce this shape.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: |
                A complete sentence shown verbatim in a dialog on the phone.
                Never a stack trace, a file path or a bare code.
              minLength: 1

  responses:
    # Each response carries the exact sentence the user will see. If you
    # change a message in src/errors.ts, change it here in the same commit -
    # test/openapi.test.ts fails the build if the two disagree. That includes
    # the long messages below, which enumerate the matrix: they are long
    # because the person reading them needs the list.

    ConvertedToPdf:
      description: |
        The converted document, as PDF.
      headers:
        X-Request-Id:
          description: |
            Identifier for this request, also present in the server log line.
            Quote it when reporting a problem.
          schema:
            type: string
        Content-Disposition:
          schema:
            type: string
          example: attachment; filename="Quarterly report.pdf"; filename*=UTF-8''Quarterly%20report.pdf
      content:
        application/pdf:
          schema:
            type: string
            format: binary
            description: The PDF bytes, beginning with `%PDF-`.

    ConvertedToTarget:
      description: |
        The converted file.

        The media type is the target's own - `application/pdf` for `pdf`,
        `text/csv` for `csv`, and so on. **The image targets are the exception**:
        `png` and `jpg` always answer with `application/zip`, because there is
        one image per page and a ZIP is the only way to put several files in one
        response.
      headers:
        X-Request-Id:
          schema:
            type: string
        Content-Disposition:
          description: |
            The uploaded file's name with the target's extension. Sanitised:
            path segments and control characters are stripped, and a name with
            nothing usable in it becomes `converted.<ext>`.

            Sent in both RFC 6266 forms - a quoted ASCII `filename` for older
            clients and a percent-encoded UTF-8 `filename*` for current ones -
            so a non-ASCII name survives.
          schema:
            type: string
          example: attachment; filename="Quarterly report.xlsx"; filename*=UTF-8''Quarterly%20report.xlsx
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        application/zip:
          schema:
            type: string
            format: binary
            description: |
              A ZIP, for every target that reports `multiple: true` at
              `GET /formats`. What is inside depends on the target:

                - `png` / `jpg` - one image per page, named `slide-1.png`,
                  `slide-2.png`, ...
                - `layers` - one PNG per layer of a PSD, at the path its group
                  gives it (`Buttons/Hover.png`), plus `manifest.json`
                  describing every layer, including any that produced no image
                  and why.

              The response is an archive even when it holds a single file, so
              that the content type never depends on how many pages or layers
              the upload happened to have.
        application/vnd.oasis.opendocument.text:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.wordprocessingml.document:
          schema:
            type: string
            format: binary
        application/vnd.oasis.opendocument.spreadsheet:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
        application/vnd.oasis.opendocument.presentation:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.presentationml.presentation:
          schema:
            type: string
            format: binary
        application/epub+zip:
          schema:
            type: string
            format: binary
        application/rtf:
          schema:
            type: string
            format: binary
        text/plain:
          schema:
            type: string
        text/csv:
          schema:
            type: string
        text/html:
          schema:
            type: string

    BadRequest:
      description: |
        The request was not a usable upload: no file part named `file`, several
        files, or a part under a different name.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_BAD_REQUEST
              message: The document could not be received. Please try again.

    NotFound:
      description: |
        No such endpoint. In practice this means the client is older than the
        server, which is why the message tells the user to update the app.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_BAD_REQUEST
              message: The converter is not available at this address. Please update the app and try again.

    UnknownTarget:
      description: |
        The target in the path is not a format this service can produce at all -
        `/convert/banana`. Distinct from a real target the source cannot become,
        which is a `415`: this one is a `404` because the address does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_UNKNOWN_TARGET
              message: 'That is not a format this converter can produce. Available: PDF, ODT, DOCX, TXT, HTML, RTF, EPUB, ODS, XLSX, CSV, ODP, PPTX, PNG, JPG, XLSX (tables), PNG (layers), PDF/A.'

    TooLarge:
      description: |
        The upload exceeds 26214400 bytes (25 MB). Applied by the reverse proxy,
        by the multipart parser and by the client, all using the same limit.

        Also returned when an image target would produce more pages than the
        server will hold in memory at once, which is a bound on the archive
        rather than on the upload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_TOO_LARGE
              message: This document is too large to convert.

    Unsupported:
      description: |
        The filename extension is not one this service accepts. The extension -
        not the declared MIME type - selects the import filter.

        The message lists the accepted extensions, because the person holding
        the phone has a file they believe is a document, and "unsupported"
        alone tells them nothing about what would work.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_UNSUPPORTED
              message: 'This file type cannot be converted. Supported types: .docx, .docm, .doc, .odt, .ods, .odp, .xlsx, .pptx, .csv, .txt, .html, .htm, .rtf, .png, .jpg, .jpeg, .psd, .pdf.'

    UnsupportedTarget:
      description: |
        A real target, but not one this source can become - asking for `png`
        from a `.docx`, say. This is a `415` and not a `404`, because the
        address exists; it is the combination that does not.

        The message names what the document CAN become instead, because the
        useful answer to "can I have this as X" is "no, but here is what you can
        have". The list varies by source, so the example below is the one for a
        Word document; see `GET /formats` for the rest.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_UNSUPPORTED_TARGET
              message: 'A .docx file can be converted to: PDF, ODT, TXT, HTML, RTF, EPUB, XLSX (tables).'

    Unprocessable:
      description: |
        The document was received and read, and the answer is that there is no
        answer. Two quite different situations land here, and both are the
        document's own doing rather than a fault:

        **Password protected.** Detected before LibreOffice runs, because
        LibreOffice reports an encrypted document the same way it reports a
        corrupt one, and telling a user their file is damaged when it merely
        needs a password is both wrong and unhelpful.

        **No tables, and no layers.** Only an `extract` target can produce
        either: those are the targets that read the document's contents rather
        than converting the document as a whole, so they are the only ones that
        can open a file successfully and find nothing to work with. Reporting
        one as a conversion failure would say the file may be damaged when the
        truth is that it is a perfectly good document with no tables in it, or
        one whose layers are all adjustment and text layers and therefore have
        no pixels to write.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            encrypted:
              summary: The document needs a password.
              value:
                error:
                  code: E_ENCRYPTED
                  message: This document is password protected.
            noTables:
              summary: A `tables` request on a document with no tables.
              value:
                error:
                  code: E_NO_TABLES
                  message: This document does not contain any tables.
            noLayers:
              summary: A `layers` request on a PSD with nothing drawable in it.
              value:
                error:
                  code: E_NO_LAYERS
                  message: This PSD file does not contain any layers with images that can be extracted.

    BadPageRange:
      description: |
        The `pages`/`order` field named something that is not a coherent
        instruction against the document it came with: missing, malformed
        (not `2,5-7,10`), naming a page outside the document, or - for
        `/pdf/organize` only - not a true permutation of every page.

        The message is the specific problem rather than a fixed sentence: a
        page number is something the person who typed it can fix, where a
        generic "bad request" is not.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            outOfRange:
              summary: A page outside the document.
              value:
                error:
                  code: E_BAD_PAGE_RANGE
                  message: Page 9 does not exist in this 5-page document.
            notAPermutation:
              summary: '`/pdf/organize`: a page was dropped or repeated.'
              value:
                error:
                  code: E_BAD_PAGE_RANGE
                  message: The order must name every page exactly once (1-5), with no repeats and none missing.

    TooFewFiles:
      description: |
        `/pdf/merge` needs at least two files, and `/pdf/scan-to-pdf` needs at
        least one - both a genuine "there is nothing to do" rather than a
        malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_TOO_FEW_FILES
              message: Merging needs at least two PDF files.

    RateLimited:
      description: |
        Too many requests from this address in the current window.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_RATE_LIMITED
              message: Too many requests. Try again in a moment.

    ConvertFailed:
      description: |
        The conversion produced nothing. Covers a damaged document, a document
        whose content does not match its extension, and a zero-byte upload.

        Note that LibreOffice's exit code is **not** used to decide this:
        `--convert-to` exits `0` even when it converts nothing, so the only
        trustworthy signal is whether a non-empty file of the expected type
        appeared on disk.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          # A 500 is either something LibreOffice refused or an unanticipated
          # fault. Both are documented, because a client that only handles the
          # first will be surprised by the second.
          examples:
            damaged:
              summary: The conversion produced no file
              value:
                error:
                  code: E_CONVERT_FAILED
                  message: This document could not be converted. It may be damaged or in a format the converter does not support.
            internal:
              summary: Unanticipated server fault
              value:
                error:
                  code: E_INTERNAL
                  message: Something went wrong on the server.

    Busy:
      description: |
        Every conversion slot is taken and the waiting queue is full. Returned
        immediately rather than queueing without bound, so the client gets a
        fast, honest answer instead of a request that hangs until it times out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_BUSY
              message: The converter is busy. Try again in a moment.

    Timeout:
      description: |
        The conversion exceeded the server's 90 second deadline. The running
        LibreOffice process is sent `SIGTERM` and then `SIGKILL`.

        This is deliberately shorter than the client's own 120 second abort, so
        that the server answers with this response rather than being killed
        mid-conversion and leaving the phone to report a network failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_TIMEOUT
              message: This document took too long to convert.
