openapi: 3.1.0

info:
  title: Universal file converter
  version: 2.0.0
  summary: Converts documents, spreadsheets, presentations and images using LibreOffice headless.
  description: |
    Uploads a file and receives it converted to another format.

    ## The contract

    This API is consumed by two clients: a **shipped Android app** and a
    browser-based **converter web app**. The Android app is why the following
    properties are part of the contract and are not free to change - a mobile
    client cannot be patched the moment the server changes, the way the web
    app can be redeployed alongside it. The web app relies on the JSON error
    envelope and the status-before-body rule the same way, but carries no
    separate abort timer or media-type check of its own worth pinning here.

    > **Breaking change: `POST /convert` without a target no longer exists.**
    > Clients must post to `/convert/pdf`. A client still using the bare path
    > gets the catch-all `404`, whose message tells the user to update the app.

    - **Success is `200` with the target's own media type.** For `pdf` that is
      exactly `application/pdf`, with no charset suffix: the client compares the
      header and refuses anything else, so a stray `text/html` on a `200` is a
      client-visible failure.
    - **Failure is a non-2xx with the JSON error envelope.** The client reads
      `error.message` and shows it verbatim in a dialog, falling back to
      `"HTTP <status>"` when the body is missing or is not JSON.
    - **A failure is never a `200`.** The client checks the status before it
      reads anything, so a `200` is treated as the converted file and fails
      downstream.
    - **`error.message` is user-facing prose.** It is a complete sentence with
      no stack traces, no paths and no codes, because a person reads it.
      `error.code` is for logs and metrics only; the client never displays it.

    ## Choosing the output format

    The target is part of the path and is REQUIRED: `/convert/pdf`,
    `/convert/xlsx`, `/convert/png`. There is deliberately no bare `/convert`
    that assumes a format - one address that means one thing is easier to
    document and to test than two that mean the same thing.

    **Not every source can become every target.** The matrix is finite and
    deliberate - `GET /formats` returns it in full, machine-readably. Asking for
    a target that exists but is not reachable from your file is a `415`; asking
    for a target that does not exist at all is a `404`. Both messages list the
    alternatives, so a client never has to hard-code the table to give a useful
    error.

    ## Filenames

    The response offers the uploaded file's name with the new extension:
    `Quarterly report.docx` converted to `pdf` downloads as
    `Quarterly report.pdf`. The name is sanitised before it is echoed - path
    segments and control characters are removed - and a name with nothing usable
    in it becomes `converted.<ext>`.

    ## Image targets are archives

    `png` and `jpg` produce **one image per page**, so they answer with
    `application/zip` holding `slide-1.png`, `slide-2.png`, ... This is true even
    for a one-page document: the content type must not depend on how many pages
    the upload happened to have, or every client has to sniff what it received.

    ## Timing

    The client aborts the whole request after **120 seconds**. The server's own
    deadline is **90 seconds** and covers the entire pipeline - including the
    render-then-rasterise second step an image target needs - so that it can
    still answer with a proper `504` instead of being killed mid-conversion.

    ## Uploads, and bulk conversion

    Requests are `multipart/form-data` with one or more file parts, all under
    the field name `files`. The import filter for each is chosen from its own
    **filename extension**, never from the declared MIME type: the client
    deliberately sends `application/octet-stream`, and a hostile client could
    declare anything at all.

    **Exactly one file** gets the response this endpoint has always given:
    the converted file itself (or its own archive, for an image target) with
    the target's media type. **Two or more files** are each converted
    independently against the same `target`, and the response is always one
    `application/zip` holding every result - one file's failure does not fail
    the rest, and is instead recorded in an `errors.json` entry inside the
    same archive. See `ConvertedToTarget` for the exact shape of both cases.
  contact:
    name: Converter maintainers
  license:
    name: Proprietary

servers:
  - url: /
    description: This server

tags:
  - name: convert
    description: Document conversion.
  - name: media
    description: |
      Asynchronous audio/video conversion. Deliberately not part of
      `/convert/{target}`'s synchronous contract - see `POST /media/{target}`'s
      own description for why.
  - name: pages
    description: Page-level PDF operations - merge, split, remove, extract, reorder, scan.
  - name: discovery
    description: What this service can do.
  - name: ops
    description: Operational endpoints.

paths:
  /convert/{target}:
    post:
      tags: [convert]
      operationId: convertToFormat
      summary: Convert one or more files to a named format
      description: |
        Converts every uploaded file to `target`, which must be an id from
        `GET /formats` (`pdf`, `odt`, `docx`, `txt`, `html`, `rtf`, `epub`,
        `ods`, `xlsx`, `csv`, `odp`, `pptx`, `png`, `jpg`, `tables`, `layers`,
        `pdfa`), independently of one another - a file that cannot reach
        `target` (wrong extension, damaged document) does not stop the rest
        of the batch when more than one file was uploaded. With exactly one
        file, that failure IS the response, exactly as it always was.

        Each document is parsed by LibreOffice, which is a large C++ codebase
        handling untrusted input. **Treat a conversion failure as an expected,
        normal event**, not as an incident.

        The endpoint is unauthenticated and cannot be otherwise: the client is
        an APK, so any secret shipped inside it is public. Requests are
        rate-limited per IP and conversions run under a bounded concurrency
        limit; both are sources of `429` and `503` that a well-formed request
        can hit.

        A PDF with no extractable text at all (a scan), or one built on
        Type3 fonts, asking for `docx` is OCR'd before reconstruction by
        default - see the `ocr` field on the request body.
      x-max-upload-bytes: 26214400
      parameters:
        - name: target
          in: path
          required: true
          description: |
            The format to produce. Case-sensitive, without a leading dot.
          schema:
            $ref: '#/components/schemas/TargetId'
      requestBody:
        $ref: '#/components/requestBodies/Upload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToTarget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/UnknownTarget'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedTarget'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'
        '504':
          $ref: '#/components/responses/Timeout'

  /media/{target}:
    post:
      tags: [media]
      operationId: convertMediaToFormat
      summary: Start an asynchronous audio/video conversion job
      description: |
        Accepts one audio or video file and starts converting it to `target`
        in the background, answering `202` with a job id the moment the
        upload is validated - it does NOT wait for the conversion to finish.
        Poll `GET /media/jobs/{id}` for status, and
        `GET /media/jobs/{id}/download` once it reports `done`.

        This is a separate endpoint from `POST /convert/{target}` on purpose:
        a real audio/video transcode routinely runs far longer than that
        endpoint's deadline, and needs an upload ceiling far above the 25MB
        the Android client's wire contract fixes for `/convert`. Nothing
        about `/convert/{target}`'s existing contract changes because of this
        endpoint.

        `target` and the source extension must be the same KIND (audio to
        audio, video to video) and must differ from one another - converting
        a file to its own format is refused the same way it is everywhere
        else in this service.

        Audio: `mp3`, `wav`, `flac`, `ogg`, `aac`, `m4a`, `wma`.
        Video: `mp4`, `webm`, `mkv`, `avi`, `mov`, `flv`. This is a smaller
        set than audio/video formats could in principle cover - see
        `formats-media.ts`'s own comment for the reasoning and the wider list
        a future pass could verify and add.
      x-max-upload-bytes: 524288000
      parameters:
        - name: target
          in: path
          required: true
          description: One of the audio/video target ids listed above. Case-sensitive.
          schema:
            $ref: '#/components/schemas/MediaTargetId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: string
                  format: binary
                  description: Exactly one audio or video file.
      responses:
        '202':
          description: The job was accepted and is now queued or running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaJobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: |
            `target` is not a recognised audio/video format id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: E_UNKNOWN_TARGET
                  message: That is not an audio/video format this converter can produce.
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedTarget'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Busy'

  /media/jobs/{id}:
    get:
      tags: [media]
      operationId: getMediaJobStatus
      summary: Get the status of an asynchronous media job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The job's current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaJobStatus'
        '404':
          $ref: '#/components/responses/JobNotFound'

  /media/jobs/{id}/download:
    get:
      tags: [media]
      operationId: downloadMediaJobResult
      summary: Download a finished media job's result
      description: |
        Returns the converted file once the job's status is `done`. A job
        whose status is `queued`/`running` answers `409`; one whose status
        is `failed` answers with the same error envelope its own status
        response carries, at the status code that failure would have used
        had it happened synchronously (`500` for `E_CONVERT_FAILED`, `504`
        for `E_TIMEOUT`, and so on).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The converted audio/video file.
          content:
            audio/*: {}
            video/*: {}
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          $ref: '#/components/responses/JobNotReady'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '504':
          $ref: '#/components/responses/Timeout'

  /pdf/merge:
    post:
      tags: [pages]
      operationId: mergePdfs
      summary: Merge two or more PDFs into one
      description: |
        Concatenates every page of every uploaded PDF into one PDF, in the
        order the files were uploaded. Each file contributes all of its own
        pages, in its own order - there is no separate page-selection step
        here, only file order.
      requestBody:
        $ref: '#/components/requestBodies/MergeUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/TooFewFiles'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/split:
    post:
      tags: [pages]
      operationId: splitPdf
      summary: Split a PDF into several PDFs
      description: |
        Cuts one PDF into consecutive chunks of `every` pages each, answered
        as a ZIP of `part-1.pdf`, `part-2.pdf`, ... - always an archive, even
        when the result is a single part, so the response shape never depends
        on how the split happened to come out.
      requestBody:
        $ref: '#/components/requestBodies/SplitUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToTarget'
        '400':
          $ref: '#/components/responses/BadPageRange'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/remove-pages:
    post:
      tags: [pages]
      operationId: removePdfPages
      summary: Remove pages from a PDF
      description: |
        Answers with the PDF minus the named pages, everything else kept in
        its original order. Removing every page is refused with `400` rather
        than answering with an empty PDF nobody could open.
      requestBody:
        $ref: '#/components/requestBodies/RemovePagesUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/BadPageRange'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/extract-pages:
    post:
      tags: [pages]
      operationId: extractPdfPages
      summary: Extract a subset of a PDF's pages
      description: |
        Answers with a PDF holding only the named pages, in the exact order
        they were named - `pages=3,1` extracts pages 1 and 3 and puts page 3
        first, so this can reorder as well as select.
      requestBody:
        $ref: '#/components/requestBodies/ExtractPagesUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/BadPageRange'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/organize:
    post:
      tags: [pages]
      operationId: organizePdf
      summary: Reorder a PDF's pages
      description: |
        Answers with the PDF's pages rearranged into `order`, which must name
        every page exactly once - unlike `/pdf/extract-pages`, this refuses a
        selection that would drop or duplicate a page, because reordering and
        removing are different operations here.
      requestBody:
        $ref: '#/components/requestBodies/OrganizeUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/BadPageRange'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/scan-to-pdf:
    post:
      tags: [pages]
      operationId: scanToPdf
      summary: Build a PDF from a set of images
      description: |
        Answers with one PDF holding one page per uploaded image, in upload
        order. Each page is sized to its own image's pixel dimensions, so a
        portrait photo and a landscape photo in the same request each get a
        correctly-shaped page rather than being forced into one fixed size.
      requestBody:
        $ref: '#/components/requestBodies/ScanUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/TooFewFiles'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/rotate:
    post:
      tags: [pages]
      operationId: rotatePdf
      summary: Rotate a PDF's pages
      description: |
        Rotates the named pages (or every page, if `pages` is omitted) by
        `degrees` clockwise, added to whatever rotation each page already
        carries rather than replacing it.
      requestBody:
        $ref: '#/components/requestBodies/RotateUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/InvalidField'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/watermark:
    post:
      tags: [pages]
      operationId: watermarkPdf
      summary: Stamp text across a PDF's pages
      description: |
        Draws `text` across the named pages (or every page, if `pages` is
        omitted), semi-transparent, sized to each page's own dimensions. The
        original page content is untouched underneath it.
      requestBody:
        $ref: '#/components/requestBodies/WatermarkUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/InvalidField'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/protect:
    post:
      tags: [pages]
      operationId: protectPdf
      summary: Add a password to a PDF
      description: |
        Encrypts the PDF with `password` as both its user and owner password.
        Refuses a file that is already encrypted with `422` - re-protecting an
        already-protected file is not a coherent request; unlock it first.
      requestBody:
        $ref: '#/components/requestBodies/ProtectUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/InvalidField'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/unlock:
    post:
      tags: [pages]
      operationId: unlockPdf
      summary: Remove a PDF's password
      description: |
        Decrypts the PDF using `password`. A password that does not open the
        file is refused with `422 E_WRONG_PASSWORD`, distinct from the
        `E_ENCRYPTED` every other page endpoint gives an encrypted input -
        this endpoint's whole purpose is to accept one.
      requestBody:
        $ref: '#/components/requestBodies/UnlockUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/InvalidField'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/WrongPassword'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/crop:
    post:
      tags: [pages]
      operationId: cropPdf
      summary: Crop a PDF's pages
      description: |
        Shrinks the named pages (or every page, if `pages` is omitted) by
        trimming `left`/`right`/`top`/`bottom` points off each edge - each
        defaults to `0`. This shrinks the crop box, not the page content: the
        trimmed area still exists in the file, only outside what a viewer or
        printer shows.
      requestBody:
        $ref: '#/components/requestBodies/CropUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/InvalidField'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/page-numbers:
    post:
      tags: [pages]
      operationId: addPageNumbers
      summary: Draw page numbers on a PDF
      description: |
        Draws a number on every page, starting from `startAt` (default `1`)
        and counting up one per page in document order - there is no partial
        mode, since a page number that disagrees with its own position would
        be worse than no page number at all.
      requestBody:
        $ref: '#/components/requestBodies/PageNumbersUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/InvalidField'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/repair:
    post:
      tags: [pages]
      operationId: repairPdf
      summary: Repair a damaged PDF
      description: |
        Reads the PDF and rewrites it, fixing whatever the reader can
        recover from - a broken cross-reference table, a truncated update, a
        damaged linearization hint stream. Refuses an encrypted file, the
        same as every other page endpoint: there is no password field here.
      requestBody:
        $ref: '#/components/requestBodies/RepairUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/compress:
    post:
      tags: [pages]
      operationId: compressPdf
      summary: Recompress a PDF to shrink it
      description: |
        Recompresses the PDF's own streams, objects and images with qpdf -
        the same engine `/pdf/protect`, `/pdf/unlock` and `/pdf/repair` use,
        rather than adding Ghostscript or another engine for one more
        endpoint. Refuses an encrypted file, the same as every other page
        endpoint: qpdf needs the file unlocked to rewrite it at all.

        `level` (default `medium`) controls how aggressively images are
        recompressed:

          - `low`: recompacts the PDF's internal object/stream structure
            only. No image is re-encoded, so this is close to lossless.
          - `medium`: also re-runs flate compression at its slowest, smallest
            setting and re-encodes images above roughly 200x200 pixels as
            JPEG where that is smaller.
          - `high`: the same as `medium`, but with no minimum image size -
            every image, however small, is a candidate for JPEG
            re-encoding.

        Unlike `/pdf/repair`, a damaged input that qpdf can only partially
        recover (its "warnings only" exit code) is treated as a failure here,
        not a success - a compression request should not silently also
        repair and re-save a broken file.
      requestBody:
        $ref: '#/components/requestBodies/CompressUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/InvalidField'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/ocr:
    post:
      tags: [pages]
      operationId: ocrPdf
      summary: Make a PDF searchable
      description: |
        Adds an invisible, searchable OCR text layer to a PDF and answers
        with the result - the same OCR engine `/convert/docx` uses
        internally on a scanned source, exposed here as its own "make this
        searchable" endpoint rather than only a side effect of a Word export.

        With `force` false (the default): a PDF that already has real text
        on every page is returned unchanged, since there is nothing to do.
        A PDF with no extractable text at all (a scan) is OCR'd.

        With `force` true: the PDF is re-OCR'd unconditionally, discarding
        whatever text is already there first - for a document whose existing
        text layer is wrong in some way and cannot be trusted.
      requestBody:
        $ref: '#/components/requestBodies/OcrUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/InvalidField'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'
        '504':
          $ref: '#/components/responses/Timeout'

  /pdf/form-fields:
    post:
      tags: [pages]
      operationId: listPdfFormFields
      summary: List a PDF's AcroForm fields
      description: |
        Answers with JSON describing every AcroForm field in the PDF: its
        name, type, current value and (for a radio group, dropdown or option
        list) its available choices. A PDF with no AcroForm at all - most
        PDFs - answers with an empty array, not an error: the document opened
        fine and simply has no form fields, the same "nothing to extract"
        situation `E_NO_TABLES`/`E_NO_LAYERS` describe for other extractors.

        This is the one page endpoint that answers with `application/json`
        instead of a PDF.
      requestBody:
        $ref: '#/components/requestBodies/RepairUpload'
      responses:
        '200':
          $ref: '#/components/responses/FormFieldsResult'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/fill-form:
    post:
      tags: [pages]
      operationId: fillPdfForm
      summary: Fill a PDF's AcroForm fields
      description: |
        Sets the named AcroForm fields to the given values and answers with
        the resulting PDF. `fields` is a JSON object mapping each field name
        to a string (text, radio, dropdown or option-list fields) or a
        boolean (checkboxes). Naming a field that does not exist on the form
        is refused with `400 E_INVALID_FIELD`, as is a value of the wrong
        type for its field.

        With `flatten` true, the filled values are baked into permanent page
        content and the form fields are removed afterwards - useful for a
        "final" document nobody should edit further. Defaults to `false`,
        leaving the fields in place and editable.
      requestBody:
        $ref: '#/components/requestBodies/FillFormUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/InvalidField'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/compare:
    post:
      tags: [pages]
      operationId: comparePdfs
      summary: Diff two PDFs, page by page
      description: |
        Answers with JSON: each pair of pages (up to the shorter document's
        page count) is compared as text, line by line, and reported as either
        equal or a list of `equal`/`insert`/`delete`/`replace` diff chunks.
        Pages beyond the shorter document's length are reported separately as
        `extraPagesInA`/`extraPagesInB` rather than diffed against nothing.

        Needs EXACTLY two PDFs, under the field name `files` - one file or
        three or more is refused with `400`.
      requestBody:
        $ref: '#/components/requestBodies/CompareUpload'
      responses:
        '200':
          $ref: '#/components/responses/CompareResult'
        '400':
          $ref: '#/components/responses/TooFewFiles'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/sign:
    post:
      tags: [pages]
      operationId: signPdf
      summary: Stamp a "simple signature" onto a PDF's pages
      description: |
        Draws `elements` permanently onto the page content - a typed, drawn or
        uploaded signature/initials, a company stamp image, or a name/date/
        free text field - each placed by the caller at an exact `x`/`y`/
        `width`/`height` box on a given page.

        This is a VISUAL mark only, the same kind `/pdf/watermark` and
        `/pdf/page-numbers` bake in, not a cryptographic signature: there is
        no certificate, no PKI, and nothing an eIDAS/ESIGN/UETA-style
        verifier would recognise as a digital signature. Real (certificate-
        based) signing is not implemented by this endpoint or this service.

        `elements` is a JSON array (as a plain multipart text field, like
        `/pdf/fill-form`'s `fields`). Each element:

        ```
        {
          "type": "signature" | "initials" | "stamp" | "name" | "date" | "text",
          "page": 1,
          "x": 72, "y": 700, "width": 200, "height": 40,
          "value": "Ada Lovelace",
          "imageIndex": 0,
          "fontStyle": "cursive",
          "color": "black"
        }
        ```

        `x`/`y` are TOP-LEFT origin in points - (0,0) is the page's top-left
        corner, the natural coordinate system a browser canvas overlay
        reports - which this endpoint flips internally to PDF's bottom-left
        origin.

        Exactly one of `value`/`imageIndex` is required per element, and
        which one depends on `type`: `"stamp"` REQUIRES `imageIndex` (there
        is no typed stamp); `"name"`/`"date"`/`"text"` REQUIRE `value` (there
        is no image form of these, and they always render in a plain font
        regardless of `fontStyle`); `"signature"`/`"initials"` accept EITHER
        - `value` for a typed signature, `imageIndex` for one drawn or
        uploaded as an image.

        `imageIndex` is a 0-based index into the `images` files uploaded
        alongside `file`. Only PNG/JPG are accepted for `images` - SVG
        signature/stamp uploads are not supported, since rasterising
        arbitrary SVG would need a conversion step (a dedicated rasteriser or
        LibreOffice Draw) this pipeline does not otherwise have.

        `fontStyle` (default `"cursive"`) only affects a TYPED signature/
        initials: `"cursive"` is an embedded handwriting-style font,
        `"cursive2"` a second, visually distinct style, `"plain"` a plain
        sans-serif. `color` (default `"black"`) applies to any text-rendered
        element; both are ignored for image-backed elements.
      requestBody:
        $ref: '#/components/requestBodies/SignUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/InvalidField'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/redact:
    post:
      tags: [pages]
      operationId: redactPdf
      summary: Permanently remove content under `areas`, not draw over it
      description: |
        For every rectangle in `areas`, the underlying text, embedded images
        and vector graphics that intersect it are genuinely DELETED from the
        document - not covered by an opaque box drawn on top, which would
        leave the original content fully intact and extractable underneath
        (`pdftotext`, copy-paste, or any viewer's "show hidden layers" would
        still recover it). This is real redaction: after this endpoint runs,
        the removed content is not present anywhere in the output PDF's text
        or graphics, confirmed by extracting text from a redacted region and
        finding it gone.

        `areas` is a JSON array (a plain multipart text field, like
        `/pdf/fill-form`'s `fields` and `/pdf/sign`'s `elements`):

        ```
        [{ "page": 1, "x": 100, "y": 200, "width": 150, "height": 30 }]
        ```

        `page` is 1-based. `x`/`y`/`width`/`height` are in points, TOP-LEFT
        origin - `(0,0)` is the page's top-left corner, the same convention
        `/pdf/sign`'s `elements` already use, so a caller already familiar
        with that endpoint's coordinate system reuses it here unchanged.

        Limitation, observed directly rather than assumed: the underlying
        engine removes exactly the glyphs/graphics that intersect the
        rectangle, at whatever granularity the page's content stream stores
        them at - it does NOT expand a partial overlap to cover a whole word.
        A rectangle covering only the first half of a word removes only
        that half; the remaining half is still fully present, both visually
        and in extracted text. A rectangle must fully cover everything that
        needs to disappear - a caller drawing an under-sized box will leak
        a visible, readable fragment of the "redacted" content.

        `areas` must be non-empty: a redact request naming nothing to redact
        is not treated as a harmless no-op, since there is no reason to call
        this endpoint at all with nothing to remove.
      requestBody:
        $ref: '#/components/requestBodies/RedactUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/InvalidField'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /pdf/edit:
    post:
      tags: [pages]
      operationId: editPdf
      summary: Draw text, images, shapes and freehand strokes onto a PDF's pages
      description: |
        The general-purpose sibling of `/pdf/sign`: draws `elements`
        permanently onto the page content, where `/pdf/sign` only ever draws
        one of six signature-shaped marks, this draws free text, an image,
        a rectangle, an ellipse, a line or a freehand stroke, each placed by
        the caller anywhere on a given page. Same request shape as
        `/pdf/sign` (a JSON `elements` array, plus any images it references)
        and the same VISUAL-mark caveat: this bakes pixels/glyphs into the
        page content, it is not an editable annotation layer and it is not a
        cryptographic signature.

        `elements` is a JSON array (as a plain multipart text field, like
        `/pdf/sign`'s `elements`). Each element's shape depends on its
        `type` - there is no one geometry every mark shares:

        ```
        [
          { "type": "text", "page": 1, "x": 72, "y": 700, "value": "Approved", "fontSize": 14, "color": "red" },
          { "type": "image", "page": 1, "x": 72, "y": 600, "width": 120, "height": 40, "imageIndex": 0 },
          { "type": "rectangle", "page": 1, "x": 72, "y": 500, "width": 150, "height": 30, "color": "blue", "fill": false },
          { "type": "ellipse", "page": 1, "x": 72, "y": 450, "width": 60, "height": 60, "color": "green", "fill": true },
          { "type": "line", "page": 1, "x1": 72, "y1": 400, "x2": 220, "y2": 400, "color": "black", "strokeWidth": 2 },
          { "type": "freehand", "page": 1, "points": [{"x":72,"y":350},{"x":90,"y":360},{"x":110,"y":345}], "color": "black" }
        ]
        ```

        - **`text`**: `x`/`y` (the box's top-left corner), `value`
          (required), optional `fontSize` (default `14`) and `color`.
        - **`image`**: `x`/`y`/`width`/`height` and `imageIndex`, a 0-based
          index into the `images` files uploaded alongside `file` - PNG/JPG
          only, the same as `/pdf/sign`'s `images`.
        - **`rectangle`** / **`ellipse`**: `x`/`y`/`width`/`height`, optional
          `color`, `strokeWidth` (default `2`) and `fill` (default `false` -
          outline only; `true` fills the shape with `color` instead).
        - **`line`**: `x1`/`y1`/`x2`/`y2` endpoints, optional `color` and
          `strokeWidth`.
        - **`freehand`**: `points`, an array of at least two `{x, y}`
          coordinates in drawing order, connected as a polyline - optional
          `color` and `strokeWidth`. This is a piecewise-straight
          approximation of the stroke, not a fitted curve; sampling
          mouse/touch movement at a reasonable rate makes the difference
          visually negligible.

        Every position is TOP-LEFT origin in points - `(0,0)` is the page's
        top-left corner, the same convention `/pdf/sign` and `/pdf/redact`
        already use, flipped internally to PDF's bottom-left origin.
      requestBody:
        $ref: '#/components/requestBodies/EditUpload'
      responses:
        '200':
          $ref: '#/components/responses/ConvertedToPdf'
        '400':
          $ref: '#/components/responses/InvalidField'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ConvertFailed'
        '503':
          $ref: '#/components/responses/Busy'

  /formats:
    get:
      tags: [discovery]
      operationId: listFormats
      summary: The conversion matrix
      description: |
        Every source extension this service accepts, and every target each one
        can become.

        Exists so a client does not have to hard-code the table: the shipped
        client is an APK, and without this, teaching it a new output format
        would mean shipping a new APK. A client that hard-codes the matrix will
        silently disagree with the server the first time the server grows.
      responses:
        '200':
          description: The matrix.
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [sources, targets]
                properties:
                  sources:
                    type: array
                    description: Accepted upload types, keyed by extension.
                    items:
                      type: object
                      required: [extension, mediaType, family, targets]
                      properties:
                        extension:
                          type: string
                          example: .docx
                        mediaType:
                          type: string
                        family:
                          type: [string, 'null']
                          description: |
                            The LibreOffice document family that handles it.
                            Sources in the same family convert the same way.

                            `null` for a source LibreOffice does not open at
                            all - `.psd` today. Such a source is handled
                            entirely by this service's own code, which is why
                            it can only ever offer `extract` targets; its
                            absence is a fact about the source rather than a
                            field this version happens to omit.
                          enum: [writer, calc, impress, draw, null]
                        targets:
                          type: array
                          items:
                            $ref: '#/components/schemas/TargetId'
                  targets:
                    type: array
                    description: Every format this service can produce.
                    items:
                      type: object
                      required: [id, extension, mediaType, label, multiple]
                      properties:
                        id:
                          $ref: '#/components/schemas/TargetId'
                        extension:
                          type: string
                          example: .pdf
                        mediaType:
                          type: string
                        label:
                          type: string
                          description: Short name, as used in error messages.
                          example: PDF
                        multiple:
                          type: boolean
                          description: |
                            When true the response is a ZIP of one file per page
                            rather than a single file. Always an archive for
                            these, even for a one-page source.
              example:
                sources:
                  - extension: .docx
                    mediaType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
                    family: writer
                    targets: [pdf, odt, txt, html, rtf, epub]
                targets:
                  - id: pdf
                    extension: .pdf
                    mediaType: application/pdf
                    label: PDF
                    multiple: false
                  - id: png
                    extension: .png
                    mediaType: image/png
                    label: PNG
                    multiple: true

  /health:
    get:
      tags: [ops]
      operationId: health
      summary: Liveness check
      description: |
        Returns `ok` once the service is ready to convert.

        The service only begins listening after LibreOffice has been confirmed
        on `PATH`, the rasteriser has been confirmed, the metric-compatible
        fonts have been verified, and a warm-up conversion has succeeded **for
        every document family** - so reaching this endpoint at all means the
        whole matrix is ready, not merely that the process is up.

        It does not exercise a conversion of its own.
      responses:
        '200':
          description: The service is ready.
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok

components:
  requestBodies:
    Upload:
      required: true
      description: |
        One or more file parts, all named `files`, plus the optional `ocr`
        field below. A request with no `files` part is rejected with `400`;
        one under any other name is simply not this field and is ignored the
        same way any unrecognised part would be.

        Each file is capped at **26214400 bytes (25 MB)**, matching the
        client's own `MAX_UPLOAD_BYTES` and the reverse proxy's body limit -
        exceeding it at any layer produces `413`. With more than one file,
        their combined size is additionally capped (`MAX_CONVERT_TOTAL_BYTES`,
        100 MB by default) and their count is capped at `MAX_CONVERT_FILES`
        (15 by default), both also `413`.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [files]
            properties:
              files:
                type: array
                minItems: 1
                items:
                  type: string
                  format: binary
                description: |
                  The file(s) to convert. Each one's **filename extension**
                  selects its own import filter and must be one of the
                  extensions listed by `GET /formats` (case-insensitive). The
                  declared `Content-Type` of each part is ignored.

                  Filenames are never used as a path on disk: each upload is
                  written to a server-generated name inside its own temporary
                  directory, so a name like `../../etc/passwd.docx` is
                  harmless.
              ocr:
                type: string
                enum: ['true', 'false']
                default: 'true'
                description: |
                  Only meaningful for a PDF asking for `docx` with no
                  extractable text (a scan) or built on Type3 fonts -
                  silently ignored by every other source/target pair. When
                  true (the default), the page is OCR'd, so it becomes real,
                  reflowable text instead of an uneditable picture of one -
                  with no embedded image, for either case. Set to `false` to
                  skip OCR and get the page as a plain image with no text
                  instead. Applies to every file in the request alike.
          encoding:
            files:
              contentType: application/octet-stream

    MergeUpload:
      required: true
      description: |
        Two or more PDFs, all under the field name `files`, in the order they
        should be concatenated.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [files]
            properties:
              files:
                type: array
                minItems: 2
                items:
                  type: string
                  format: binary
                description: The PDFs to merge, in order. Each must be a `.pdf`.

    SplitUpload:
      required: true
      description: One PDF, plus how many pages each output file should hold.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: The PDF to split.
              every:
                type: string
                description: |
                  Pages per output file, as a positive whole number. Defaults
                  to `1` (one file per page). The last file holds whatever is
                  left over: a 7-page document split every 3 pages produces
                  3, 3, then 1 page.
                example: '1'

    RemovePagesUpload:
      required: true
      description: One PDF, plus which pages to remove.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, pages]
            properties:
              file:
                type: string
                format: binary
                description: The PDF to remove pages from.
              pages:
                type: string
                description: |
                  1-based page numbers and inclusive ranges to remove, comma
                  separated: `2,5-7,10`. Removing every page is refused.
                example: '2,5-7'

    ExtractPagesUpload:
      required: true
      description: One PDF, plus which pages to keep, in the order to keep them.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, pages]
            properties:
              file:
                type: string
                format: binary
                description: The PDF to extract pages from.
              pages:
                type: string
                description: |
                  1-based page numbers and inclusive ranges to keep, comma
                  separated, in the exact order they should appear in the
                  output: `3,1,2` keeps pages 1-3, reordered.
                example: '1,3-4'

    OrganizeUpload:
      required: true
      description: One PDF, plus its new page order.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, order]
            properties:
              file:
                type: string
                format: binary
                description: The PDF to reorder.
              order:
                type: string
                description: |
                  The new page order, as 1-based page numbers and inclusive
                  ranges naming EVERY page of the document exactly once:
                  `3,1,2` on a 3-page document reorders it, but `1,2` or
                  `1,1,2` are refused, because organizing does not drop or
                  duplicate a page - use `/pdf/remove-pages` to drop one.
                example: '3,1,2'

    ScanUpload:
      required: true
      description: |
        One or more images, all under the field name `files`, in the order
        they should become pages.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [files]
            properties:
              files:
                type: array
                minItems: 1
                items:
                  type: string
                  format: binary
                description: |
                  The images to scan, in order. Each must be `.png`, `.jpg`
                  or `.jpeg`. Each page is sized to its own image's pixel
                  dimensions, so mixing portrait and landscape photos is fine.

    RotateUpload:
      required: true
      description: One PDF, how far to rotate it, and optionally which pages.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, degrees]
            properties:
              file:
                type: string
                format: binary
                description: The PDF to rotate.
              degrees:
                type: string
                description: |
                  Clockwise rotation in degrees, as a multiple of 90 (may be
                  negative). Added to each page's existing rotation.
                example: '90'
              pages:
                type: string
                description: |
                  1-based page numbers and inclusive ranges to rotate, comma
                  separated: `2,5-7,10`. Omit to rotate every page.
                example: '1,3'

    WatermarkUpload:
      required: true
      description: One PDF, the text to stamp, and optionally which pages.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, text]
            properties:
              file:
                type: string
                format: binary
                description: The PDF to watermark.
              text:
                type: string
                description: The text to stamp across each page.
                example: CONFIDENTIAL
              pages:
                type: string
                description: |
                  1-based page numbers and inclusive ranges to stamp, comma
                  separated. Omit to stamp every page.
                example: '1,3'

    ProtectUpload:
      required: true
      description: One PDF, plus the password to encrypt it with.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, password]
            properties:
              file:
                type: string
                format: binary
                description: The PDF to encrypt. Must not already be encrypted.
              password:
                type: string
                description: Used as both the user and owner password.

    UnlockUpload:
      required: true
      description: One encrypted PDF, plus the password that opens it.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, password]
            properties:
              file:
                type: string
                format: binary
                description: The encrypted PDF to decrypt.
              password:
                type: string
                description: The password that opens the file.

    CropUpload:
      required: true
      description: One PDF, plus the margins to trim and optionally which pages.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: The PDF to crop.
              left:
                type: string
                description: Points to trim off the left edge. Defaults to `0`.
                example: '10'
              right:
                type: string
                description: Points to trim off the right edge. Defaults to `0`.
              top:
                type: string
                description: Points to trim off the top edge. Defaults to `0`.
              bottom:
                type: string
                description: Points to trim off the bottom edge. Defaults to `0`.
              pages:
                type: string
                description: |
                  1-based page numbers and inclusive ranges to crop, comma
                  separated. Omit to crop every page.
                example: '1,3'

    PageNumbersUpload:
      required: true
      description: One PDF, plus where to draw the numbers and where to start.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: The PDF to number.
              position:
                type: string
                enum: [bottom-center, bottom-left, bottom-right]
                description: Where each number is drawn. Defaults to `bottom-center`.
              startAt:
                type: string
                description: The number to draw on the first page. Defaults to `1`.
                example: '1'

    RepairUpload:
      required: true
      description: One PDF to repair. No other fields.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            additionalProperties: false
            properties:
              file:
                type: string
                format: binary
                description: The PDF to repair.

    CompressUpload:
      required: true
      description: One PDF, plus optionally how aggressively to recompress it.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            additionalProperties: false
            properties:
              file:
                type: string
                format: binary
                description: The PDF to compress. Must not already be encrypted.
              level:
                type: string
                enum: [low, medium, high]
                default: medium
                description: |
                  How aggressively to recompress images and streams. `low`
                  is close to lossless (no image re-encoding); `medium`
                  (the default) re-encodes larger images as JPEG where
                  smaller; `high` does the same with no minimum image size.

    OcrUpload:
      required: true
      description: One PDF, plus whether to unconditionally re-OCR it.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            additionalProperties: false
            properties:
              file:
                type: string
                format: binary
                description: The PDF to make searchable.
              force:
                type: string
                enum: ['true', 'false']
                default: 'false'
                description: |
                  When true, re-OCR the PDF unconditionally, discarding any
                  existing text layer first. When false (the default), a PDF
                  that already has real text is returned unchanged and only
                  a PDF with none is OCR'd.

    FillFormUpload:
      required: true
      description: One PDF, plus the field values to set.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, fields]
            additionalProperties: false
            properties:
              file:
                type: string
                format: binary
                description: The PDF whose form fields should be filled.
              fields:
                type: string
                description: |
                  A JSON object mapping each field name to its new value: a
                  string for a text, radio, dropdown or option-list field, or
                  a boolean for a checkbox.
                example: '{"name": "Ada Lovelace", "agree": true}'
              flatten:
                type: string
                enum: ['true', 'false']
                default: 'false'
                description: |
                  When true, bake the filled values into permanent page
                  content and remove the form fields afterwards, so the
                  result is no longer editable.

    CompareUpload:
      required: true
      description: Exactly two PDFs, both under the field name `files`.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [files]
            properties:
              files:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: string
                  format: binary
                description: The two PDFs to compare.

    SignUpload:
      required: true
      description: One PDF, the elements to stamp onto it, and any images those elements reference.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, elements]
            additionalProperties: false
            properties:
              file:
                type: string
                format: binary
                description: The PDF being signed.
              elements:
                type: string
                description: |
                  A JSON array of elements to draw onto the page. See the
                  `/pdf/sign` description for the full shape and the rules
                  around `value`/`imageIndex`.
                example: |
                  [{"type":"name","page":1,"x":72,"y":700,"width":200,"height":24,"value":"Ada Lovelace"}]
              images:
                type: array
                description: |
                  PNG/JPG images referenced by 0-based index from
                  `elements[].imageIndex` - drawn/uploaded signatures,
                  initials and company stamps. Optional; omit entirely when
                  every element is typed text.
                items:
                  type: string
                  format: binary

    RedactUpload:
      required: true
      description: One PDF, plus the regions to permanently strip from it.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, areas]
            additionalProperties: false
            properties:
              file:
                type: string
                format: binary
                description: The PDF to redact.
              areas:
                type: string
                description: |
                  A non-empty JSON array of `{page, x, y, width, height}`
                  regions to genuinely remove (not merely cover) - see the
                  `/pdf/redact` description for the full coordinate contract
                  and the partial-overlap limitation.
                example: '[{"page":1,"x":100,"y":200,"width":150,"height":30}]'

    EditUpload:
      required: true
      description: One PDF, the elements to draw onto it, and any images those elements reference.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, elements]
            additionalProperties: false
            properties:
              file:
                type: string
                format: binary
                description: The PDF being edited.
              elements:
                type: string
                description: |
                  A JSON array of marks to draw onto the page. See the
                  `/pdf/edit` description for the full shape - it differs by
                  `type` (`text`/`image`/`rectangle`/`ellipse`/`line`/
                  `freehand`).
                example: |
                  [{"type":"text","page":1,"x":72,"y":700,"value":"Approved","fontSize":14}]
              images:
                type: array
                description: |
                  PNG/JPG images referenced by 0-based index from
                  `elements[].imageIndex` (`type: "image"` elements only).
                  Optional; omit entirely when no element is an image.
                items:
                  type: string
                  format: binary

  schemas:
    FormField:
      type: object
      description: One AcroForm field, as read by `POST /pdf/form-fields`.
      required: [name, type]
      properties:
        name:
          type: string
          description: The field's fully-qualified name in the PDF.
        type:
          type: string
          enum: [text, checkbox, radio, dropdown, optionList, button, unknown]
        value:
          description: |
            The field's current value: a string for `text`, a boolean for
            `checkbox`, a string (or absent, if nothing is selected) for
            `radio`/`dropdown`, an array of strings for a multiselect
            `optionList`, or absent for `button`/`unknown`.
        options:
          type: array
          items:
            type: string
          description: Available choices - `radio`, `dropdown` and `optionList` only.

    ComparePageDiffOp:
      type: object
      required: [op, a, b]
      properties:
        op:
          type: string
          enum: [equal, insert, delete, replace]
        a:
          type: array
          items:
            type: string
          description: The lines from document A this chunk covers.
        b:
          type: array
          items:
            type: string
          description: The lines from document B this chunk covers.

    ComparePage:
      type: object
      required: [page, equal]
      properties:
        page:
          type: integer
          description: 1-based page number.
        equal:
          type: boolean
        diff:
          type: array
          description: Present only when `equal` is false.
          items:
            $ref: '#/components/schemas/ComparePageDiffOp'

    TargetId:
      type: string
      description: |
        Identifier of an output format, as used in the `/convert/{target}` path
        and returned by `GET /formats`.
      enum:
        [pdf, odt, docx, txt, html, rtf, epub, ods, xlsx, csv, odp, pptx, png, jpg, tables, layers, pdfa, markdown, zip, tar, "tar.gz", "tar.bz2", "7z", cbz, srt, vtt, ass, ssa, tsv, json, yaml, jsonl, bmp, gif, tiff, webp, avif, ico, "png-image", "jpg-image"]

    MediaTargetId:
      type: string
      description: |
        Identifier of an audio/video output format, as used in the
        `/media/{target}` path - a separate id space from `TargetId`, since
        this is a separate matrix (`formats-media.ts`), not an extension of
        the main one.
      enum: [mp3, wav, flac, ogg, aac, m4a, wma, opus, aiff, m4b, mp4, webm, mkv, avi, mov, flv]

    MediaJobStatusValue:
      type: string
      enum: [queued, running, done, failed]

    MediaJobAccepted:
      type: object
      required: [id, status, statusUrl]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The job id - pass this to `GET /media/jobs/{id}` and its `/download`.
        status:
          $ref: '#/components/schemas/MediaJobStatusValue'
        statusUrl:
          type: string
          description: Always `/media/jobs/{id}`, given back so a client does not have to build it itself.

    MediaJobStatus:
      type: object
      required: [id, status, target]
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/MediaJobStatusValue'
        target:
          $ref: '#/components/schemas/MediaTargetId'
        downloadUrl:
          type: string
          description: Present only when `status` is `done`.
        bytes:
          type: integer
          description: The converted file's size, in bytes. Present only when `status` is `done`.
        error:
          type: object
          description: |
            Present only when `status` is `failed` - the same `{code,
            message}` shape `ErrorEnvelope.error` carries, not wrapped in a
            second `error` key.
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string

    ErrorCode:
      type: string
      description: |
        Stable machine-readable identifier for the failure. For logs, metrics
        and support only - the client never shows this to the user.
      enum:
        - E_CONVERT_FAILED
        - E_TIMEOUT
        - E_ENCRYPTED
        - E_UNSUPPORTED
        - E_UNSUPPORTED_TARGET
        - E_UNKNOWN_TARGET
        - E_TOO_LARGE
        - E_NO_TABLES
        - E_NO_LAYERS
        - E_NOT_TABULAR
        - E_BAD_PAGE_RANGE
        - E_TOO_FEW_FILES
        - E_WRONG_PASSWORD
        - E_INVALID_FIELD
        - E_BUSY
        - E_BAD_REQUEST
        - E_RATE_LIMITED
        - E_INTERNAL
        - E_JOB_NOT_FOUND
        - E_JOB_NOT_READY

    ErrorEnvelope:
      type: object
      description: |
        The body of every non-2xx response. There are no exceptions: error
        paths that Express or multer would normally render as an HTML page are
        overridden to produce this shape.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: |
                A complete sentence shown verbatim in a dialog on the phone.
                Never a stack trace, a file path or a bare code.
              minLength: 1

  responses:
    # Each response carries the exact sentence the user will see. If you
    # change a message in src/errors.ts, change it here in the same commit -
    # test/openapi.test.ts fails the build if the two disagree. That includes
    # the long messages below, which enumerate the matrix: they are long
    # because the person reading them needs the list.

    ConvertedToPdf:
      description: |
        The converted document, as PDF.
      headers:
        X-Request-Id:
          description: |
            Identifier for this request, also present in the server log line.
            Quote it when reporting a problem.
          schema:
            type: string
        Content-Disposition:
          schema:
            type: string
          example: attachment; filename="Quarterly report.pdf"; filename*=UTF-8''Quarterly%20report.pdf
      content:
        application/pdf:
          schema:
            type: string
            format: binary
            description: The PDF bytes, beginning with `%PDF-`.

    FormFieldsResult:
      description: |
        Every AcroForm field in the PDF - `[]` if it has no form at all.
      headers:
        X-Request-Id:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FormField'
          example:
            - name: name
              type: text
              value: ''
            - name: agree
              type: checkbox
              value: false

    CompareResult:
      description: |
        The per-page text diff of the two uploaded PDFs.
      headers:
        X-Request-Id:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required: [pageCountA, pageCountB, pages, extraPagesInA, extraPagesInB]
            properties:
              pageCountA:
                type: integer
              pageCountB:
                type: integer
              pages:
                type: array
                description: One entry per page pair, up to the shorter document's length.
                items:
                  $ref: '#/components/schemas/ComparePage'
              extraPagesInA:
                type: array
                items:
                  type: integer
                description: 1-based pages that exist in A but not in B.
              extraPagesInB:
                type: array
                items:
                  type: integer
                description: 1-based pages that exist in B but not in A.
          example:
            pageCountA: 2
            pageCountB: 2
            pages:
              - page: 1
                equal: true
              - page: 2
                equal: false
                diff:
                  - op: replace
                    a: [Hello world]
                    b: [Goodbye world]
            extraPagesInA: []
            extraPagesInB: []

    ConvertedToTarget:
      description: |
        The converted file - or files.

        **Exactly one file uploaded:** the media type is the target's own -
        `application/pdf` for `pdf`, `text/csv` for `csv`, and so on. The image
        targets are the exception: `png` and `jpg` always answer with
        `application/zip`, because there is one image per page and a ZIP is
        the only way to put several files in one response.

        **Two or more files uploaded:** always `application/zip`, regardless
        of target, holding one entry per input file named
        `<NN>-<original name>.<target extension>` (`01-report.pdf`,
        `02-invoice.pdf`, ...), or a `<NN>-<original name>/` folder of images
        for an image target. A file that failed to convert contributes no
        entry of its own; instead, if any file in the batch failed, the
        archive additionally holds `errors.json` - an array of
        `{ file, code, message }`, in upload order, naming every failure. A
        batch where every file failed still answers `200` with a ZIP holding
        only `errors.json`, because the failures are per file, not a fact
        about the request as a whole.
      headers:
        X-Request-Id:
          schema:
            type: string
        Content-Disposition:
          description: |
            The uploaded file's name with the target's extension. Sanitised:
            path segments and control characters are stripped, and a name with
            nothing usable in it becomes `converted.<ext>`.

            Sent in both RFC 6266 forms - a quoted ASCII `filename` for older
            clients and a percent-encoded UTF-8 `filename*` for current ones -
            so a non-ASCII name survives.
          schema:
            type: string
          example: attachment; filename="Quarterly report.xlsx"; filename*=UTF-8''Quarterly%20report.xlsx
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        application/zip:
          schema:
            type: string
            format: binary
            description: |
              A ZIP, for every target that reports `multiple: true` at
              `GET /formats`. What is inside depends on the target:

                - `png` / `jpg` - one image per page, named `slide-1.png`,
                  `slide-2.png`, ...
                - `layers` - one PNG per layer of a PSD, at the path its group
                  gives it (`Buttons/Hover.png`), plus `manifest.json`
                  describing every layer, including any that produced no image
                  and why.

              The response is an archive even when it holds a single file, so
              that the content type never depends on how many pages or layers
              the upload happened to have.
        application/vnd.oasis.opendocument.text:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.wordprocessingml.document:
          schema:
            type: string
            format: binary
        application/vnd.oasis.opendocument.spreadsheet:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
        application/vnd.oasis.opendocument.presentation:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.presentationml.presentation:
          schema:
            type: string
            format: binary
        application/epub+zip:
          schema:
            type: string
            format: binary
        application/rtf:
          schema:
            type: string
            format: binary
        text/plain:
          schema:
            type: string
        text/csv:
          schema:
            type: string
        text/html:
          schema:
            type: string

    BadRequest:
      description: |
        The request was not a usable upload: no file part named `file`, several
        files, a part under a different name - or, distinctly, the optional
        `ocr` field was something other than `true`/`false`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            badRequest:
              summary: No usable file part.
              value:
                error:
                  code: E_BAD_REQUEST
                  message: The document could not be received. Please try again.
            invalidOcrField:
              summary: The `ocr` field was not `true`/`false`.
              value:
                error:
                  code: E_INVALID_FIELD
                  message: The "ocr" field must be "true" or "false".

    NotFound:
      description: |
        No such endpoint. In practice this means the client is older than the
        server, which is why the message tells the user to update the app.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_BAD_REQUEST
              message: The converter is not available at this address. Please update the app and try again.

    UnknownTarget:
      description: |
        The target in the path is not a format this service can produce at all -
        `/convert/banana`. Distinct from a real target the source cannot become,
        which is a `415`: this one is a `404` because the address does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_UNKNOWN_TARGET
              message: 'That is not a format this converter can produce. Available: PDF, ODT, DOCX, TXT, HTML, RTF, EPUB, ODS, XLSX, CSV, ODP, PPTX, PNG, JPG, XLSX (tables), PNG (layers), PDF/A, Markdown, ZIP, TAR, TAR.GZ, TAR.BZ2, 7Z, CBZ, SRT, VTT, ASS, SSA, TSV, JSON, YAML, JSONL, BMP, GIF, TIFF, WEBP, AVIF, ICO, PNG (image), JPG (image).'

    TooLarge:
      description: |
        The upload exceeds 26214400 bytes (25 MB). Applied by the reverse proxy,
        by the multipart parser and by the client, all using the same limit.

        Also returned when an image target would produce more pages than the
        server will hold in memory at once, which is a bound on the archive
        rather than on the upload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_TOO_LARGE
              message: This document is too large to convert.

    Unsupported:
      description: |
        The filename extension is not one this service accepts. The extension -
        not the declared MIME type - selects the import filter.

        The message lists the accepted extensions, because the person holding
        the phone has a file they believe is a document, and "unsupported"
        alone tells them nothing about what would work.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_UNSUPPORTED
              message: 'This file type cannot be converted. Supported types: .docx, .docm, .doc, .dot, .dotx, .odt, .ods, .odg, .odp, .xlsx, .xls, .xlsm, .pptx, .ppt, .pptm, .pps, .ppsx, .pot, .potx, .csv, .txt, .html, .htm, .rtf, .png, .jpg, .jpeg, .psd, .pdf, .md, .rst, .tex, .textile, .org, .opml, .muse, .ipynb, .zip, .tar, .tgz, .tbz2, .txz, .gz, .bz2, .xz, .7z, .iso, .cbz, .bmp, .gif, .tiff, .webp, .avif, .ico, .srt, .vtt, .ass, .ssa, .tsv, .json, .yaml, .yml, .jsonl.'

    UnsupportedTarget:
      description: |
        A real target, but not one this source can become - asking for `png`
        from a `.docx`, say. This is a `415` and not a `404`, because the
        address exists; it is the combination that does not.

        The message names what the document CAN become instead, because the
        useful answer to "can I have this as X" is "no, but here is what you can
        have". The list varies by source, so the example below is the one for a
        Word document; see `GET /formats` for the rest.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_UNSUPPORTED_TARGET
              message: 'A .docx file can be converted to: PDF, ODT, TXT, HTML, RTF, EPUB, XLSX (tables).'

    Unprocessable:
      description: |
        The document was received and read, and the answer is that there is no
        answer. Two quite different situations land here, and both are the
        document's own doing rather than a fault:

        **Password protected.** Detected before LibreOffice runs, because
        LibreOffice reports an encrypted document the same way it reports a
        corrupt one, and telling a user their file is damaged when it merely
        needs a password is both wrong and unhelpful.

        **No tables, and no layers.** Only an `extract` target can produce
        either: those are the targets that read the document's contents rather
        than converting the document as a whole, so they are the only ones that
        can open a file successfully and find nothing to work with. Reporting
        one as a conversion failure would say the file may be damaged when the
        truth is that it is a perfectly good document with no tables in it, or
        one whose layers are all adjustment and text layers and therefore have
        no pixels to write.

        **Not a table.** A `csv`/`tsv`/`jsonl` request against a JSON/YAML
        source whose content is not shaped for that target - a single object
        rather than a top-level array, or nesting a delimited format has no
        way to represent. The same reasoning as no-tables/no-layers: the
        document is valid, just not shaped for what was asked of it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            encrypted:
              summary: The document needs a password.
              value:
                error:
                  code: E_ENCRYPTED
                  message: This document is password protected.
            noTables:
              summary: A `tables` request on a document with no tables.
              value:
                error:
                  code: E_NO_TABLES
                  message: This document does not contain any tables.
            noLayers:
              summary: A `layers` request on a PSD with nothing drawable in it.
              value:
                error:
                  code: E_NO_LAYERS
                  message: This PSD file does not contain any layers with images that can be extracted.
            notTabular:
              summary: A `csv` request on a JSON document that is a single object, not a list.
              value:
                error:
                  code: E_NOT_TABULAR
                  message: This document is not a flat table of records (a top-level list of flat objects), so it cannot become CSV.

    BadPageRange:
      description: |
        The `pages`/`order` field named something that is not a coherent
        instruction against the document it came with: missing, malformed
        (not `2,5-7,10`), naming a page outside the document, or - for
        `/pdf/organize` only - not a true permutation of every page.

        The message is the specific problem rather than a fixed sentence: a
        page number is something the person who typed it can fix, where a
        generic "bad request" is not.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            outOfRange:
              summary: A page outside the document.
              value:
                error:
                  code: E_BAD_PAGE_RANGE
                  message: Page 9 does not exist in this 5-page document.
            notAPermutation:
              summary: '`/pdf/organize`: a page was dropped or repeated.'
              value:
                error:
                  code: E_BAD_PAGE_RANGE
                  message: The order must name every page exactly once (1-5), with no repeats and none missing.

    TooFewFiles:
      description: |
        `/pdf/merge` needs at least two files, `/pdf/scan-to-pdf` needs at
        least one, and `/pdf/compare` needs EXACTLY two - each a genuine
        "there is nothing to do" (or "not what was asked for") rather than a
        malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            merge:
              summary: '`/pdf/merge`: fewer than two files.'
              value:
                error:
                  code: E_TOO_FEW_FILES
                  message: Merging needs at least two PDF files.
            compare:
              summary: '`/pdf/compare`: not exactly two files.'
              value:
                error:
                  code: E_TOO_FEW_FILES
                  message: Comparing needs exactly two PDF files.

    InvalidField:
      description: |
        A form field for `/pdf/rotate`, `/pdf/watermark`, `/pdf/protect`,
        `/pdf/unlock`, `/pdf/ocr` or `/pdf/fill-form` (`degrees`, `text`,
        `password`, `force`, `fields`) is missing or malformed. The message
        names the specific field and what is wrong with it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missingDegrees:
              summary: '`/pdf/rotate`: not a multiple of 90.'
              value:
                error:
                  code: E_INVALID_FIELD
                  message: The "degrees" field must be a multiple of 90.
            missingText:
              summary: '`/pdf/watermark`: no text given.'
              value:
                error:
                  code: E_INVALID_FIELD
                  message: The "text" field is required.
            badForce:
              summary: '`/pdf/ocr`: `force` was not `true`/`false`.'
              value:
                error:
                  code: E_INVALID_FIELD
                  message: The "force" field must be "true" or "false".
            unknownFormField:
              summary: '`/pdf/fill-form`: a field name the PDF does not have.'
              value:
                error:
                  code: E_INVALID_FIELD
                  message: There is no form field named "nope" in this PDF.

    WrongPassword:
      description: |
        `/pdf/unlock` was given a password that does not open the file.
        Distinct from `E_ENCRYPTED`: that code means the file was refused
        because it is locked; this one means a password was tried and it was
        the wrong one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_WRONG_PASSWORD
              message: That password does not unlock this PDF.

    JobNotFound:
      description: |
        `GET /media/jobs/{id}` (or its `/download`) named a job id that does
        not exist - never did, or was removed after `MEDIA_JOB_TTL_MS` past
        completion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_JOB_NOT_FOUND
              message: That conversion job does not exist.

    JobNotReady:
      description: |
        `GET /media/jobs/{id}/download` was called before the job reached
        `done`. Poll `GET /media/jobs/{id}` until its `status` is `done` (or
        `failed`) before downloading.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_JOB_NOT_READY
              message: This conversion is still in progress. Check back in a moment.

    RateLimited:
      description: |
        Too many requests from this address in the current window.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_RATE_LIMITED
              message: Too many requests. Try again in a moment.

    ConvertFailed:
      description: |
        The conversion produced nothing. Covers a damaged document, a document
        whose content does not match its extension, and a zero-byte upload.

        Note that LibreOffice's exit code is **not** used to decide this:
        `--convert-to` exits `0` even when it converts nothing, so the only
        trustworthy signal is whether a non-empty file of the expected type
        appeared on disk.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          # A 500 is either something LibreOffice refused or an unanticipated
          # fault. Both are documented, because a client that only handles the
          # first will be surprised by the second.
          examples:
            damaged:
              summary: The conversion produced no file
              value:
                error:
                  code: E_CONVERT_FAILED
                  message: This document could not be converted. It may be damaged or in a format the converter does not support.
            internal:
              summary: Unanticipated server fault
              value:
                error:
                  code: E_INTERNAL
                  message: Something went wrong on the server.

    Busy:
      description: |
        Every conversion slot is taken and the waiting queue is full. Returned
        immediately rather than queueing without bound, so the client gets a
        fast, honest answer instead of a request that hangs until it times out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_BUSY
              message: The converter is busy. Try again in a moment.

    Timeout:
      description: |
        The conversion exceeded the server's 90 second deadline. The running
        LibreOffice process is sent `SIGTERM` and then `SIGKILL`.

        This is deliberately shorter than the client's own 120 second abort, so
        that the server answers with this response rather than being killed
        mid-conversion and leaving the phone to report a network failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: E_TIMEOUT
              message: This document took too long to convert.
