name: Deploy Converter API

on:
  push:
    branches: [master]
    # Nothing in these paths ends up in the image, so a commit touching only
    # them has nothing to deploy.
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'test/**'
      - 'LICENSE'
  # Lets you re-run a deploy without pushing a commit - the useful case being a
  # server-side fix that needs the same deploy applied again.
  workflow_dispatch:

# Two pushes in quick succession would otherwise run two deploys against the
# same checkout at the same time. Serialise them, and let an in-flight deploy
# finish rather than cancelling it half-applied.
concurrency:
  group: deploy-converterapi
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/samad126/converterapi

jobs:
  # The image is built HERE, on GitHub's runner, not on the server. The server
  # is slower and is serving real conversions at the same time: building there
  # took 10-45 minutes (the apt layer alone took over 20 on a cache miss) and
  # competed with live requests for RAM and CPU. Layers are cached between runs
  # in the GitHub Actions cache, so a code-only change rebuilds only the small
  # app layers.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy converterapi to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p 44544 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            APP_DIR=/pool/www/converter.alakbaroff.com/backend

            # The exact image this run built. Pinning the commit SHA, not
            # `latest`, means a rollback is just re-deploying an older SHA:
            #   IMAGE_TAG=<old sha> docker compose -f $APP_DIR/docker-compose.yml up -d converterapi
            export IMAGE_TAG=${{ github.sha }}

            # The checkout is owned by whatever user first cloned it, which is
            # not necessarily the one this deploy logs in as. Without this, git
            # refuses to touch it: "detected dubious ownership in repository".
            git config --global --add safe.directory "$APP_DIR"

            # The image comes from the registry now, but the server still needs
            # the checkout: the compose file and the seccomp profile it mounts
            # live here.
            #
            # Deliberately fetch + hard reset, not `git pull`. This checkout is
            # a deploy target, not a workstation: nobody should be committing
            # into it by hand, so there is nothing worth preserving if it ever
            # diverges from origin/master - and `pull` alone refuses outright
            # the moment it does. Reset makes the server's checkout an exact
            # mirror of the pushed commit every time.
            git -C "$APP_DIR" fetch origin master
            git -C "$APP_DIR" reset --hard origin/master

            # Pull the prebuilt image (only the layers that changed) and replace
            # the converterapi service only. No --build: nothing is compiled on
            # this machine any more.
            docker compose -f "$APP_DIR/docker-compose.yml" pull converterapi
            docker compose -f "$APP_DIR/docker-compose.yml" up -d --no-deps converterapi

            # `up -d` returns once the container is *started*, which is not the
            # same as ready - and it reports success just as happily for a
            # container that is about to crashloop. /health only answers after
            # preflight AND the warm-up conversion have both passed, so polling
            # it is what actually separates a good deploy from a dead one.
            #
            # 40 x 5s = 200s, roughly double the compose healthcheck's 90s
            # start period.
            #
            # A flag and a `break`, deliberately NOT `exit 0` inside the loop.
            # This script arrives on ssh's stdin: exiting the shell while the
            # heredoc still has unread lines left makes ssh return non-zero,
            # so a deploy that succeeded reports as a failed step. Running to
            # the natural end keeps the exit status honest.
            #
            # Expect the first attempts to fail with "Connection reset by
            # peer" - the container is up but Node has not bound the port yet.
            # That is what the retry loop is for, so the noise is suppressed.
            healthy=0
            for i in $(seq 1 40); do
              if curl -fsS -o /dev/null http://127.0.0.1:3010/health 2>/dev/null; then
                echo "converterapi healthy after $((i * 5))s"
                healthy=1
                break
              fi
              sleep 5
            done

            if [ "$healthy" -ne 1 ]; then
              echo "converterapi did not become healthy within 200s" >&2
              docker compose -f "$APP_DIR/docker-compose.yml" logs --tail 100 converterapi >&2
              exit 1
            fi

            # Every deploy pulls a new image; without this the old ones pile up
            # until the disk is full. Only dangling images are removed - the
            # running one, and any tagged image, is kept.
            docker image prune -f
          EOF
